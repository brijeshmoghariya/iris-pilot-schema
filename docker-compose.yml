services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      # Local development credentials only. Nothing here is used outside this container.
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 2s
      timeout: 3s
      retries: 30
